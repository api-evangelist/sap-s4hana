specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: SAP S/4HANA
providerId: sap-s4hana
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
- ERP
- OData
- SAP
- Rate Limiting
description: SAP S/4HANA does not publish public API rate limits reachable in this reconciliation pass;
  limits are governed by the customer's commercial / partner agreement. Consumers should honor 429 / 503
  responses where they appear and follow standard exponential-backoff guidance.
notes: SAP S/4HANA is sold via SAP enterprise license agreements (Cloud, Private Cloud, On-Premise) and
  priced based on SAPS / users / modules / RISE-with-SAP commitments. The public pricing page returns
  HTTP 403; pricing is engaged via SAP sales and partner channels.
sources:
- https://www.sap.com/products/erp/s4hana.html
- https://api.sap.com/
responseCodes:
  throttled: 429
  serviceUnavailable: 503
limits:
- name: Contracted limits
  scope: account
  metric: varies
  limit: negotiated under commercial / partner agreement; not publicly published
policies:
- name: Backoff on 429
  description: Clients should implement exponential backoff with jitter on HTTP 429 responses, honoring
    the Retry-After header when present.
- name: Quota raise via account team
  description: Quota and rate-limit changes are coordinated through the SAP S/4HANA account team or partner
    manager rather than self-service.
