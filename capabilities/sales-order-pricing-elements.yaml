naftiko: 1.0.0-alpha2
info:
  label: SAP S/4HANA Sales Order API — Pricing Elements
  description: 'SAP S/4HANA Sales Order API — Pricing Elements. 2 operations. Lead operation: Sap S/4hana Retrieve Header
    Pricing Elements for a Sales Order. Self-contained Naftiko capability covering one Sap S4hana business surface.'
  tags:
  - Sap S4hana
  - Pricing Elements
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SAP_S4HANA_API_KEY: SAP_S4HANA_API_KEY
capability:
  consumes:
  - type: http
    namespace: sales-order-pricing-elements
    baseUri: https://sandbox.api.sap.com/s4hanacloud/sap/opu/odata/sap/API_SALES_ORDER_SRV
    description: SAP S/4HANA Sales Order API — Pricing Elements business capability. Self-contained, no shared references.
    resources:
    - name: A_SalesOrder('{SalesOrder}')-to_PricingElement
      path: /A_SalesOrder('{SalesOrder}')/to_PricingElement
      operations:
      - name: listsalesorderpricingelements
        method: GET
        description: Sap S/4hana Retrieve Header Pricing Elements for a Sales Order
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: A_SalesOrderItem(SalesOrder='{SalesOrder}',SalesOrderItem='{SalesOrderItem}')-to
      path: /A_SalesOrderItem(SalesOrder='{SalesOrder}',SalesOrderItem='{SalesOrderItem}')/to_PricingElement
      operations:
      - name: listsalesorderitempricingelements
        method: GET
        description: Sap S/4hana Retrieve Pricing Elements for a Sales Order Item
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.SAP_S4HANA_API_KEY}}'
  exposes:
  - type: rest
    namespace: sales-order-pricing-elements-rest
    port: 8080
    description: REST adapter for SAP S/4HANA Sales Order API — Pricing Elements. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/a-salesorder-salesorder/to-pricingelement
      name: a-salesorder-salesorder-to-pricingelement
      description: REST surface for A_SalesOrder('{SalesOrder}')-to_PricingElement.
      operations:
      - method: GET
        name: listsalesorderpricingelements
        description: Sap S/4hana Retrieve Header Pricing Elements for a Sales Order
        call: sales-order-pricing-elements.listsalesorderpricingelements
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/a-salesorderitem-salesorder-salesorder-salesorderitem-salesorderitem/to-pricingelement
      name: a-salesorderitem-salesorder-salesorder-salesorderitem-salesorderitem-to
      description: REST surface for A_SalesOrderItem(SalesOrder='{SalesOrder}',SalesOrderItem='{SalesOrderItem}')-to.
      operations:
      - method: GET
        name: listsalesorderitempricingelements
        description: Sap S/4hana Retrieve Pricing Elements for a Sales Order Item
        call: sales-order-pricing-elements.listsalesorderitempricingelements
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: sales-order-pricing-elements-mcp
    port: 9090
    transport: http
    description: MCP adapter for SAP S/4HANA Sales Order API — Pricing Elements. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: sap-s-4hana-retrieve-header
      description: Sap S/4hana Retrieve Header Pricing Elements for a Sales Order
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: sales-order-pricing-elements.listsalesorderpricingelements
      outputParameters:
      - type: object
        mapping: $.
    - name: sap-s-4hana-retrieve-pricing
      description: Sap S/4hana Retrieve Pricing Elements for a Sales Order Item
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: sales-order-pricing-elements.listsalesorderitempricingelements
      outputParameters:
      - type: object
        mapping: $.
