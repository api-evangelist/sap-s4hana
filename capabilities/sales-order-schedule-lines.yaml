naftiko: 1.0.0-alpha2
info:
  label: SAP S/4HANA Sales Order API — Schedule Lines
  description: 'SAP S/4HANA Sales Order API — Schedule Lines. 1 operations. Lead operation: Sap S/4hana Retrieve Schedule
    Lines for a Sales Order Item. Self-contained Naftiko capability covering one Sap S4hana business surface.'
  tags:
  - Sap S4hana
  - Schedule Lines
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SAP_S4HANA_API_KEY: SAP_S4HANA_API_KEY
capability:
  consumes:
  - type: http
    namespace: sales-order-schedule-lines
    baseUri: https://sandbox.api.sap.com/s4hanacloud/sap/opu/odata/sap/API_SALES_ORDER_SRV
    description: SAP S/4HANA Sales Order API — Schedule Lines business capability. Self-contained, no shared references.
    resources:
    - name: A_SalesOrderItem(SalesOrder='{SalesOrder}',SalesOrderItem='{SalesOrderItem}')-to
      path: /A_SalesOrderItem(SalesOrder='{SalesOrder}',SalesOrderItem='{SalesOrderItem}')/to_ScheduleLine
      operations:
      - name: listsalesorderitemschedulelines
        method: GET
        description: Sap S/4hana Retrieve Schedule Lines for a Sales Order Item
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.SAP_S4HANA_API_KEY}}'
  exposes:
  - type: rest
    namespace: sales-order-schedule-lines-rest
    port: 8080
    description: REST adapter for SAP S/4HANA Sales Order API — Schedule Lines. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/a-salesorderitem-salesorder-salesorder-salesorderitem-salesorderitem/to-scheduleline
      name: a-salesorderitem-salesorder-salesorder-salesorderitem-salesorderitem-to
      description: REST surface for A_SalesOrderItem(SalesOrder='{SalesOrder}',SalesOrderItem='{SalesOrderItem}')-to.
      operations:
      - method: GET
        name: listsalesorderitemschedulelines
        description: Sap S/4hana Retrieve Schedule Lines for a Sales Order Item
        call: sales-order-schedule-lines.listsalesorderitemschedulelines
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: sales-order-schedule-lines-mcp
    port: 9090
    transport: http
    description: MCP adapter for SAP S/4HANA Sales Order API — Schedule Lines. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: sap-s-4hana-retrieve-schedule
      description: Sap S/4hana Retrieve Schedule Lines for a Sales Order Item
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: sales-order-schedule-lines.listsalesorderitemschedulelines
      outputParameters:
      - type: object
        mapping: $.
